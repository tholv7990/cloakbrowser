<!doctype html><html lang="en"><head><title>Verify it's you</title></head>
<body>
  <main>
    <h1>Enter your code</h1>
    <p>We texted a code to the phone number ending in ••34.</p>

    <input id="otp" name="code" type="text" inputmode="numeric" autocomplete="one-time-code" />
